<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>팝업 브라우저 검증</title>
<style>
  body { margin: 20px; background: #e7edf3; color: #18334a; font: 14px system-ui, sans-serif; }
  p { margin: 0 0 12px; }
  .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  label { display: flex; align-items: center; gap: 6px; }
  iframe { display: block; height: 600px; border: 1px solid #b6c8d7; box-shadow: 0 10px 25px #25415b28; }
</style>
<p>테스트 전용 미리보기 · 실제 확장 저장소와 연결되지 않습니다.</p>
<div class="controls">
  <label>폭 <select id="width"><option>390</option><option>480</option><option selected>520</option><option>560</option></select>px</label>
  <label>상태 <select id="scenario">
    <option value="idle">설정 중</option><option value="armed">예약 대기</option>
    <option value="preparing">탭 준비</option><option value="selecting">시간 선택</option>
    <option value="waiting_captcha">CAPTCHA 대기</option><option value="submitting">결과 확인</option>
    <option value="needs_review">확인 필요</option><option value="completed">완료</option>
    <option value="failed">실패</option><option value="stopped">중지</option>
  </select></label>
</div>
<iframe id="popup" title="실제 팝업 UI"></iframe>
<script type="module" src="popup-browser.js"></script>
</html>
